<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Vídeos</title>
<style>
  :root{
    --bg:#0e0e12; --panel:#17171d; --panel2:#1e1e26; --line:#2a2a33;
    --text:#eceaf0; --muted:#8d8b98; --accent:#e8b04b;
    box-sizing:border-box;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  
  body { display:flex; flex-direction:column; }

  header {
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    z-index:10;
  }

  .brand { font-size:1.2rem; font-weight:700; }
  .brand span { color:var(--accent); }

  .controls { display:flex; align-items:center; gap:10px; flex:1; max-width:600px; }

  select {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:0.9rem; outline:none; cursor:pointer;
    flex:1;
  }
  select:focus { border-color:var(--accent); }

  .btn-reload {
    background:var(--accent); color:#1a1408; border:none; border-radius:8px;
    padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.88rem; white-space:nowrap;
  }
  .btn-reload:active { transform:scale(0.96); }

  main { flex:1; width:100%; height:100%; position:relative; background:#000; }

  iframe {
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
</style>
</head>
<body>

<header>
  <p class="brand">Mis<span>Vídeos</span></p>
  
  <div class="controls">
    <select id="proxySelect" onchange="changeProxy()">
      <!-- Instancias/Proxies estables de Invidious -->
      <option value="https://inv.nadeko.net">Servidor 1 (Nadeko)</option>
      <option value="https://invidious.nerdvpn.de">Servidor 2 (NerdVPN)</option>
      <option value="https://invidious.drgns.space">Servidor 3 (DRGNS)</option>
      <option value="https://yewtu.be">Servidor 4 (Yewtu.be)</option>
      <option value="https://iv.melmac.space">Servidor 5 (Melmac)</option>
    </select>
    <button class="btn-reload" onclick="reloadIframe()">🔄 Recargar</button>
  </div>
</header>

<main>
  <iframe id="mainFrame" src="https://inv.nadeko.net" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</main>

<script>
  const iframe = document.getElementById('mainFrame');
  const select = document.getElementById('proxySelect');

  function changeProxy() {
    const selectedProxy = select.value;
    iframe.src = selectedProxy;
  }

  function reloadIframe() {
    iframe.src = iframe.src;
  }
</script>

</body>
</html>
